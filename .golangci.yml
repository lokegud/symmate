run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosec
    - gocritic
    - revive
    - vet
    - fmt
    - goimports

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true

  gosec:
    severity: medium

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: error-naming
      - name: error-strings
      - name: errorf
      - name: exported
      - name: increment-decrement
      - name: indent-error-flow
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
