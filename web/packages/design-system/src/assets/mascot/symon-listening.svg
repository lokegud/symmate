<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Symon, listening">
  <defs>
    <radialGradient id="body-ls" cx="42%" cy="36%" r="62%">
      <stop offset="0%"   stop-color="#FFD6EE"/>
      <stop offset="45%"  stop-color="#FF90C8"/>
      <stop offset="100%" stop-color="#E8609E"/>
    </radialGradient>
    <radialGradient id="eye-blue-ls" cx="32%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#A8D8F0"/>
      <stop offset="38%"  stop-color="#4FA8D8"/>
      <stop offset="100%" stop-color="#1A6FA8"/>
    </radialGradient>
    <filter id="glow-ls" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="100" cy="208" rx="52" ry="7" fill="rgba(232,96,158,0.14)"/>

  <!-- Body — slightly taller/more upright (attentive) -->
  <path d="M 100 24 C 138 20,168 50,170 90 C 172 130,162 170,140 188 C 122 202,78 202,60 188 C 38 170,28 130,30 90 C 32 50,62 20,100 24 Z"
    fill="url(#body-ls)" filter="url(#glow-ls)"/>
  <path d="M 100 24 C 78 22,50 46,42 76 C 36 100,38 128,42 150"
    fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="5" stroke-linecap="round"/>

  <!-- Attention brows — arched up -->
  <path d="M 56 78 Q 76 68 92 74"  fill="none" stroke="rgba(220,90,148,0.75)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 108 74 Q 124 68 144 78" fill="none" stroke="rgba(220,90,148,0.75)" stroke-width="3" stroke-linecap="round"/>

  <!-- LEFT EYE — wider (r=22 instead of 20) -->
  <g transform="translate(76,102)">
    <circle r="22" fill="white" opacity="0.96"/>
    <circle r="15" fill="url(#eye-blue-ls)"/>
    <circle r="9"  fill="#0C2840"/>
    <circle cx="-5" cy="-5" r="5.5" fill="white" opacity="0.95"/>
    <circle cx="6"  cy="-7" r="2.8" fill="white" opacity="0.80"/>
  </g>

  <!-- RIGHT EYE — wider -->
  <g transform="translate(124,102)">
    <circle r="22" fill="white" opacity="0.96"/>
    <circle r="15" fill="url(#eye-blue-ls)"/>
    <circle r="9"  fill="#0C2840"/>
    <circle cx="-5" cy="-5" r="5.5" fill="white" opacity="0.95"/>
    <circle cx="6"  cy="-7" r="2.8" fill="white" opacity="0.80"/>
  </g>

  <ellipse cx="60"  cy="122" rx="13" ry="8" fill="rgba(240,110,160,0.22)"/>
  <ellipse cx="140" cy="122" rx="13" ry="8" fill="rgba(240,110,160,0.22)"/>

  <!-- Small attentive mouth — slightly open -->
  <path d="M 88 142 Q 100 150 112 142"
    fill="none" stroke="rgba(200,80,130,0.80)" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="100" cy="146" rx="7" ry="4" fill="rgba(190,70,118,0.35)"/>
</svg>
