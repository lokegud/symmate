<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Symon, idle">
  <defs>
    <radialGradient id="body-idle" cx="42%" cy="36%" r="62%">
      <stop offset="0%"   stop-color="#FFD6EE"/>
      <stop offset="45%"  stop-color="#FF90C8"/>
      <stop offset="100%" stop-color="#E8609E"/>
    </radialGradient>
    <radialGradient id="eye-blue" cx="32%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#A8D8F0"/>
      <stop offset="38%"  stop-color="#4FA8D8"/>
      <stop offset="100%" stop-color="#1A6FA8"/>
    </radialGradient>
    <filter id="glow-idle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="100" cy="208" rx="52" ry="7" fill="rgba(232,96,158,0.14)"/>

  <!-- Body -->
  <path d="M 100 28 C 136 24,164 52,168 90 C 172 128,162 168,140 186 C 122 200,78 200,60 186 C 38 168,28 128,32 90 C 36 52,64 24,100 28 Z"
    fill="url(#body-idle)" filter="url(#glow-idle)"/>
  <!-- Inner highlight -->
  <path d="M 100 28 C 80 26,52 48,44 76 C 38 98,40 126,44 148"
    fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="5" stroke-linecap="round"/>

  <!-- LEFT EYE -->
  <g transform="translate(76,100)">
    <circle r="20" fill="white" opacity="0.96"/>
    <circle r="13" fill="url(#eye-blue)"/>
    <circle r="7.5" fill="#0C2840"/>
    <circle cx="-4" cy="-4" r="5" fill="white" opacity="0.95"/>
    <circle cx="5"  cy="-6" r="2.5" fill="white" opacity="0.80"/>
  </g>

  <!-- RIGHT EYE -->
  <g transform="translate(124,100)">
    <circle r="20" fill="white" opacity="0.96"/>
    <circle r="13" fill="url(#eye-blue)"/>
    <circle r="7.5" fill="#0C2840"/>
    <circle cx="-4" cy="-4" r="5" fill="white" opacity="0.95"/>
    <circle cx="5"  cy="-6" r="2.5" fill="white" opacity="0.80"/>
  </g>

  <!-- Blush -->
  <ellipse cx="60"  cy="118" rx="14" ry="9" fill="rgba(240,110,160,0.28)"/>
  <ellipse cx="140" cy="118" rx="14" ry="9" fill="rgba(240,110,160,0.28)"/>

  <!-- Idle smile — gentle -->
  <path d="M 84 138 Q 100 154 116 138"
    fill="none" stroke="rgba(200,80,130,0.85)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
