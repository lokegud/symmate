<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Symon, talking">
  <defs>
    <radialGradient id="body-tk" cx="42%" cy="36%" r="62%">
      <stop offset="0%"   stop-color="#FFD6EE"/>
      <stop offset="45%"  stop-color="#FF90C8"/>
      <stop offset="100%" stop-color="#E8609E"/>
    </radialGradient>
    <radialGradient id="eye-blue-tk" cx="32%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#A8D8F0"/>
      <stop offset="38%"  stop-color="#4FA8D8"/>
      <stop offset="100%" stop-color="#1A6FA8"/>
    </radialGradient>
    <radialGradient id="mouth-inside" cx="50%" cy="60%" r="55%">
      <stop offset="0%"   stop-color="#C05080"/>
      <stop offset="100%" stop-color="#801840"/>
    </radialGradient>
    <filter id="glow-tk" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="100" cy="208" rx="54" ry="7.5" fill="rgba(232,96,158,0.18)"/>

  <!-- Body — slightly puffed up, energetic -->
  <path d="M 100 26 C 138 20,170 50,172 92 C 174 134,162 172,140 188 C 122 202,78 202,60 188 C 38 172,26 134,28 92 C 30 50,62 20,100 26 Z"
    fill="url(#body-tk)" filter="url(#glow-tk)"/>
  <path d="M 100 26 C 78 24,48 48,40 78 C 34 102,36 130,40 152"
    fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Happy squint eyes — top lid lowers slightly -->
  <!-- LEFT EYE -->
  <g transform="translate(76,100)">
    <ellipse rx="20" ry="18" fill="white" opacity="0.96"/>
    <!-- Top lid squint -->
    <path d="M -20 0 A 20 18 0 0 1 20 0 Q 14 -8 0 -10 Q -14 -8 -20 0 Z"
      fill="url(#body-tk)" opacity="0.80"/>
    <circle cy="2" r="12" fill="url(#eye-blue-tk)"/>
    <circle cy="3" r="7"  fill="#0C2840"/>
    <circle cx="-4" cy="-2" r="4.5" fill="white" opacity="0.95"/>
    <circle cx="5"  cy="-4" r="2.2" fill="white" opacity="0.80"/>
  </g>

  <!-- RIGHT EYE -->
  <g transform="translate(124,100)">
    <ellipse rx="20" ry="18" fill="white" opacity="0.96"/>
    <path d="M -20 0 A 20 18 0 0 1 20 0 Q 14 -8 0 -10 Q -14 -8 -20 0 Z"
      fill="url(#body-tk)" opacity="0.80"/>
    <circle cy="2" r="12" fill="url(#eye-blue-tk)"/>
    <circle cy="3" r="7"  fill="#0C2840"/>
    <circle cx="-4" cy="-2" r="4.5" fill="white" opacity="0.95"/>
    <circle cx="5"  cy="-4" r="2.2" fill="white" opacity="0.80"/>
  </g>

  <ellipse cx="60"  cy="118" rx="15" ry="9" fill="rgba(240,110,160,0.32)"/>
  <ellipse cx="140" cy="118" rx="15" ry="9" fill="rgba(240,110,160,0.32)"/>

  <!-- Open talking mouth -->
  <path d="M 82 136 Q 84 162 100 168 Q 116 162 118 136 Q 116 132 100 130 Q 84 132 82 136 Z"
    fill="url(#mouth-inside)"/>
  <!-- Upper lip -->
  <path d="M 82 136 Q 91 130 100 130 Q 109 130 118 136"
    fill="none" stroke="rgba(195,80,128,0.90)" stroke-width="3" stroke-linecap="round"/>
  <!-- Teeth -->
  <path d="M 86 140 Q 100 138 114 140"
    fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="4.5" stroke-linecap="round"/>
</svg>
