<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Symon, pushing back">
  <defs>
    <radialGradient id="body-pb" cx="42%" cy="36%" r="62%">
      <stop offset="0%"   stop-color="#FFCCE8"/>
      <stop offset="45%"  stop-color="#FF78B8"/>
      <stop offset="100%" stop-color="#D84890"/>
    </radialGradient>
    <radialGradient id="eye-blue-pb" cx="32%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#A8D8F0"/>
      <stop offset="38%"  stop-color="#4FA8D8"/>
      <stop offset="100%" stop-color="#1A6FA8"/>
    </radialGradient>
    <filter id="glow-pb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shadow closer/more direct (leaning forward) -->
  <ellipse cx="100" cy="210" rx="56" ry="7" fill="rgba(216,72,144,0.20)"/>

  <!-- Body — slightly forward-leaning / puffed up -->
  <path d="M 100 30 C 140 24,170 54,172 94 C 174 136,162 174,140 190 C 122 204,78 204,60 190 C 38 174,26 136,28 94 C 30 54,60 24,100 30 Z"
    fill="url(#body-pb)" filter="url(#glow-pb)"/>
  <path d="M 100 30 C 80 28,52 50,44 80 C 38 104,40 132,44 154"
    fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="5" stroke-linecap="round"/>

  <!-- Furrowed brows — angled inward (firm, not angry) -->
  <!-- Left brow: angled down toward center -->
  <path d="M 55 80 Q 72 72 88 78"  fill="none" stroke="rgba(190,60,110,0.90)" stroke-width="4" stroke-linecap="round"/>
  <!-- Right brow: angled down toward center -->
  <path d="M 112 78 Q 128 72 145 80" fill="none" stroke="rgba(190,60,110,0.90)" stroke-width="4" stroke-linecap="round"/>

  <!-- LEFT EYE — narrowed (iris lower, slight squint) -->
  <g transform="translate(76,104)">
    <ellipse rx="20" ry="17" fill="white" opacity="0.96"/>
    <!-- Top lid lowered more than talking — firm narrowing -->
    <path d="M -20 0 A 20 17 0 0 1 20 0 Q 14 -10 0 -13 Q -14 -10 -20 0 Z"
      fill="url(#body-pb)" opacity="0.88"/>
    <circle cy="3" r="12" fill="url(#eye-blue-pb)"/>
    <circle cy="4" r="7.5" fill="#0C2840"/>
    <!-- Sparkle still present — this is caring friction, not hostility -->
    <circle cx="-4" cy="-1" r="4" fill="white" opacity="0.90"/>
    <circle cx="5"  cy="-3" r="2" fill="white" opacity="0.75"/>
  </g>

  <!-- RIGHT EYE — narrowed -->
  <g transform="translate(124,104)">
    <ellipse rx="20" ry="17" fill="white" opacity="0.96"/>
    <path d="M -20 0 A 20 17 0 0 1 20 0 Q 14 -10 0 -13 Q -14 -10 -20 0 Z"
      fill="url(#body-pb)" opacity="0.88"/>
    <circle cy="3" r="12" fill="url(#eye-blue-pb)"/>
    <circle cy="4" r="7.5" fill="#0C2840"/>
    <circle cx="-4" cy="-1" r="4" fill="white" opacity="0.90"/>
    <circle cx="5"  cy="-3" r="2" fill="white" opacity="0.75"/>
  </g>

  <!-- No blush — this is the firm face -->

  <!-- Firm straight mouth, very slight downturn at corners -->
  <path d="M 84 148 Q 100 152 116 148"
    fill="none" stroke="rgba(185,60,108,0.92)" stroke-width="3.8" stroke-linecap="round"/>
  <!-- Corner downtick — subtle, not a scowl -->
  <path d="M 84 148 Q 82 151 80 154"
    fill="none" stroke="rgba(185,60,108,0.70)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 116 148 Q 118 151 120 154"
    fill="none" stroke="rgba(185,60,108,0.70)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
