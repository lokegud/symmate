<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symmate</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e10;
  --surface: #18181b;
  --border: #2a2a2e;
  --text: #e4e4e7;
  --muted: #71717a;
  --accent: #7c6af7;
  --user-bg: #1e1b2e;
  --bot-bg: #18181b;
  --radius: 12px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header */
#header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
#header-name {
  font-weight: 600;
  font-size: 16px;
}
#header-status {
  font-size: 12px;
  color: var(--muted);
  margin-left: auto;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #22c55e;
  flex-shrink: 0;
}

/* Messages */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.msg {
  max-width: 78%;
  line-height: 1.55;
  word-break: break-word;
}
.msg.user {
  align-self: flex-end;
  background: var(--user-bg);
  border: 1px solid #2d2a45;
  padding: 10px 14px;
  border-radius: var(--radius) var(--radius) 4px var(--radius);
}
.msg.bot {
  align-self: flex-start;
  color: var(--text);
}
.msg.bot p { margin-bottom: 6px; }
.msg.bot p:last-child { margin-bottom: 0; }
.msg.bot strong { color: #fff; }
.msg.bot code {
  background: #27272a;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
}
.msg.bot pre {
  background: #1a1a1d;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
  margin: 8px 0;
}
.msg.bot pre code { background: none; padding: 0; }

/* Read more button */
.read-more-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
  padding: 5px 12px;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}
.read-more-btn:hover { background: rgba(124,106,247,0.12); }

/* Input */
#input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  flex-shrink: 0;
}
#input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text);
  font-size: 15px;
  resize: none;
  outline: none;
  max-height: 120px;
  font-family: inherit;
  line-height: 1.4;
}
#input:focus { border-color: var(--accent); }
#input::placeholder { color: var(--muted); }
#send {
  background: var(--accent);
  border: none;
  border-radius: 10px;
  width: 42px;
  height: 42px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  align-self: flex-end;
  transition: opacity 0.15s;
}
#send:disabled { opacity: 0.4; cursor: default; }
#send svg { width: 18px; height: 18px; }

/* Drawer */
#drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
}
#drawer-overlay.open { display: block; }

#drawer {
  position: fixed;
  background: var(--surface);
  border-color: var(--border);
  z-index: 101;
  overflow-y: auto;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}

/* Desktop: right drawer */
@media (min-width: 640px) {
  #drawer {
    top: 0; right: 0; bottom: 0;
    width: min(480px, 45vw);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
  }
  #drawer.open { transform: translateX(0); }
}

/* Mobile: bottom drawer */
@media (max-width: 639px) {
  #drawer {
    left: 0; right: 0; bottom: 0;
    height: 80dvh;
    border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
  }
  #drawer.open { transform: translateY(0); }
}

#drawer-header {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--surface);
}
#drawer-title { font-weight: 600; font-size: 15px; }
#drawer-close {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  font-size: 20px;
}
#drawer-close:hover { color: var(--text); }
#drawer-body {
  padding: 18px;
  line-height: 1.65;
  color: var(--text);
}
#drawer-body h1,#drawer-body h2,#drawer-body h3 {
  margin: 16px 0 8px;
  color: #fff;
}
#drawer-body p { margin-bottom: 10px; }
#drawer-body code {
  background: #27272a;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 13px;
}
#drawer-body pre {
  background: #1a1a1d;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
  margin: 10px 0;
}
#drawer-body ul,#drawer-body ol {
  margin: 8px 0 10px 20px;
}

/* Mobile handle */
@media (max-width: 639px) {
  #drawer-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 10px auto 0;
  }
}
@media (min-width: 640px) {
  #drawer-handle { display: none; }
}

.typing { opacity: 0.5; }
</style>
</head>
<body>

<div id="header">
  <div class="dot"></div>
  <span id="header-name">Symmate</span>
  <span id="header-status">online</span>
</div>

<div id="messages"></div>

<div id="input-area">
  <textarea id="input" placeholder="Message…" rows="1"></textarea>
  <button id="send" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/>
    </svg>
  </button>
</div>

<div id="drawer-overlay"></div>
<div id="drawer">
  <div id="drawer-handle"></div>
  <div id="drawer-header">
    <span id="drawer-title"></span>
    <button id="drawer-close">×</button>
  </div>
  <div id="drawer-body"></div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const send = document.getElementById('send');
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawer-overlay');
const drawerTitle = document.getElementById('drawer-title');
const drawerBody = document.getElementById('drawer-body');

// Resolve chat endpoint: same origin, /chat path
const CHAT_URL = window.location.origin + '/chat';

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
send.addEventListener('click', doSend);

function addMessage(role, html, rawDoc) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = html;
  if (rawDoc) {
    const btn = document.createElement('button');
    btn.className = 'read-more-btn';
    btn.textContent = '↗ Read more';
    btn.onclick = () => openDrawer(rawDoc.title, rawDoc.content);
    el.appendChild(btn);
  }
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}

// Split [[MORE: Title]]\ncontent from a response
function parseMore(text) {
  const marker = text.indexOf('[[MORE:');
  if (marker === -1) return { preview: text, doc: null };
  const titleEnd = text.indexOf(']]', marker);
  if (titleEnd === -1) return { preview: text, doc: null };
  const title = text.slice(marker + 7, titleEnd).trim();
  const content = text.slice(titleEnd + 2).trimStart();
  const preview = text.slice(0, marker).trimEnd();
  return { preview, doc: { title, content } };
}

function renderMd(md) {
  return marked.parse(md, { breaks: true });
}


function deviceFingerprint() {
  const raw = navigator.userAgent + '|' + screen.width + 'x' + screen.height + '|' +
              (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
  let h = 0;
  for (let i = 0; i < raw.length; i++) {
    h = Math.imul(31, h) + raw.charCodeAt(i) | 0;
  }
  return 'dt' + Math.abs(h).toString(36);
}
const DEVICE_TOKEN = deviceFingerprint();

async function doSend() {
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = '';
  input.style.height = 'auto';
  send.disabled = true;

  addMessage('user', escHtml(text));

  const botEl = document.createElement('div');
  botEl.className = 'msg bot typing';
  botEl.textContent = '…';
  messages.appendChild(botEl);
  messages.scrollTop = messages.scrollHeight;

  let full = '';
  try {
    const resp = await fetch(CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, device_token: DEVICE_TOKEN }),
    });

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    botEl.textContent = '';
    botEl.classList.remove('typing');

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = dec.decode(value);
      for (const line of chunk.split('\n')) {
        if (line.startsWith('data: ')) {
          const token = line.slice(6);
          if (token === '[DONE]') continue;
          full += token;
          // live render (no doc split yet — wait for stream end)
          botEl.innerHTML = renderMd(full);
          messages.scrollTop = messages.scrollHeight;
        }
      }
    }
  } catch (e) {
    botEl.textContent = 'Connection error. Please try again.';
    botEl.classList.remove('typing');
    send.disabled = false;
    return;
  }

  // Post-stream: check for [[MORE:]] marker
  const { preview, doc } = parseMore(full);
  if (doc) {
    botEl.innerHTML = renderMd(preview);
    const btn = document.createElement('button');
    btn.className = 'read-more-btn';
    btn.textContent = '↗ ' + (doc.title || 'Read more');
    btn.onclick = () => openDrawer(doc.title, doc.content);
    botEl.appendChild(btn);
  } else {
    botEl.innerHTML = renderMd(full);
  }
  messages.scrollTop = messages.scrollHeight;
  send.disabled = false;
  input.focus();
}

function openDrawer(title, mdContent) {
  drawerTitle.textContent = title || 'Details';
  drawerBody.innerHTML = renderMd(mdContent);
  drawer.classList.add('open');
  drawerOverlay.classList.add('open');
}

function closeDrawer() {
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('open');
}

document.getElementById('drawer-close').addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);

// Swipe down to close on mobile
let touchStart = 0;
drawer.addEventListener('touchstart', e => { touchStart = e.touches[0].clientY; }, { passive: true });
drawer.addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - touchStart > 60) closeDrawer();
}, { passive: true });

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Set name from /id endpoint
fetch('/id').then(r => r.json()).then(p => {
  if (p.name) document.getElementById('header-name').textContent = p.name;
}).catch(() => {});

input.focus();
</script>
</body>
</html>
